<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Usuários</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; }

    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
    h2 { margin-bottom: 15px; color: #34495e; font-size: 1.2rem; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    input:focus { border-color: #3498db; outline: none; }

    .btn { background-color: #2ecc71; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; transition: background 0.3s; }
    .btn:hover { background-color: #27ae60; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #34495e; color: white; }
    tr:hover { background-color: #f1f1f1; }

    .alert { padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Sistema de Usuários</h1>

    <!-- Card de Cadastro -->
    <div class="card">
      <h2>Cadastrar Novo Usuário</h2>
      <div id="alertMessage" class="alert"></div>

      <form id="userForm">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="teste" required placeholder="Digite o nome completo">
        </div>
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" required placeholder="exemplo@email.com">
        </div>
        <div class="form-group">
          <label for="telefone">Telefone:</label>
          <input type="text" id="telefone" required placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
          <label for="endereco">Endereço:</label>
          <input type="text" id="endereco" required placeholder="Rua, Número, Bairro, Cidade">
        </div>
        <button type="submit" class="btn">Cadastrar Usuário</button>
      </form>
    </div>

    <!-- Card de Listagem -->
    <div class="card">
      <h2>Usuários Cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Endereço</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- Linhas inseridas dinamicamente via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:8000/usuarios';

    // Elementos do DOM
    const userForm = document.getElementById('userForm');
    const userTableBody = document.getElementById('userTableBody');
    const alertMessage = document.getElementById('alertMessage');

    // Função para exibir alertas
    function showAlert(message, isError = false) {
      alertMessage.innerText = message;
      alertMessage.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      alertMessage.style.display = 'block';
      setTimeout(() => { alertMessage.style.display = 'none'; }, 4000);
    }

    // Função para carregar e listar os usuários (GET)
    async function loadUsers() {
      try {
        const response = await fetch('http://127.0.0.1:8000/usuarios');

        if (!response.ok) throw new Error('Erro ao carregar usuários.');

        const users = await response.json();
        userTableBody.innerHTML = '';

        if (users.length === 0) {
          userTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Nenhum usuário cadastrado.</td></tr>';
          return;
        }

        users.forEach(user => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.nome}</td>
            <td>${user.email}</td>
            <td>${user.telefone}</td>
            <td>${user.endereco}</td>
          `;
          userTableBody.appendChild(row);
        });
      } catch (error) {
        console.error(error);
        userTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">' + error + '</td></tr>';
      }
    }

    // Função para cadastrar novo usuário (POST)
    userForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const userData = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        telefone: document.getElementById('telefone').value,
        endereco: document.getElementById('endereco').value
      };

      try {
        const response = await fetch('http://127.0.0.1:8000/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        });

        if (response.status === 201) {
          showAlert('Usuário cadastrado com sucesso!');
          userForm.reset();
          loadUsers(); // Atualiza a tabela
        } else {
          const errorData = await response.json();
          showAlert(errorData.detail || 'Erro ao cadastrar usuário.', true);
        }
      } catch (error) {
        showAlert('Erro de conexão com o servidor.', true);
      }
    });

    // Carrega a lista assim que a página abre
    loadUsers()
  </script>
</body>
</html>
